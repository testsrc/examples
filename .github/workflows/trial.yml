# testsrc on four open-source players, with what an evaluation token gets: 30 different cases.
# Public on purpose: each job's summary lists what passed and what didn't. report-only: the jobs stay green.
#
# The players are the current stable releases, installed in Arch Linux at a pinned date of the Arch Linux Archive:
# the same base image, date and versions as testsrc's own runner image (versions.json → runner), so a run here and
# a run on testsrc's machine see the same libvlc, FFmpeg, GStreamer and mpv. Ubuntu 24.04's packages are older
# (GStreamer 1.24 can't open a local HLS or DASH playlist, for one).
name: testsrc trial set
on:
  push:
    branches: [agent/trial-run]
  workflow_dispatch:
env:
  ARCH_DATE: "2026/11/01"
  # The 10 starter cases and 20 more: TESTSRC_WEEKLY in testsrc/run's examples.
  TESTSRC_TRIAL: >-
    starter edge/anamorphic-sar-4-3.mp4 edge/audio-starts-500ms-late.mp4
    edge/av1-hdr10.mkv edge/hevc-yuv422.mp4 edge/low-fps-10.mp4
    edge/mka-opus-codec-delay.mka edge/mkv-forced-not-default-subs.mkv edge/mkv-no-cues.mkv
    edge/opus-5.1-family-1.opus edge/rotation-90-display-matrix.mp4 edge/single-frame-video.mp4
    edge/ts-pcr-wrap.ts edge/ts-starts-at-large-pts.ts edge/tx3g-cjk.mp4
    edge/vfr-screen-recording.mp4 edge/wav-7.1-extensible.wav dash/fmp4.mpd
    hls/abr-ladder.m3u8 channels/5.1.mp4 scan/1080i-tff.mp4
jobs:
  play:
    name: ${{ matrix.player }}
    runs-on: ubuntu-24.04
    container: archlinux:base-20261025.0.616225
    strategy:
      fail-fast: false
      matrix:
        include:
          - player: libvlc
            packages: libvlc vlc-plugins-base vlc-plugins-extra gnu-free-fonts
            version: libvlc
          - player: ffmpeg
            packages: ffmpeg
            version: ffmpeg
          - player: gstreamer
            packages: gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav
            version: gstreamer
          - player: mpv
            packages: mpv jack2
            version: mpv
    steps:
      - name: Install ${{ matrix.player }} from the Arch Linux Archive, ${{ env.ARCH_DATE }}
        run: |
          echo "Server=https://archive.archlinux.org/repos/${ARCH_DATE}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --noprogressbar
          pacman -S --noconfirm --needed --noprogressbar curl jq ca-certificates ${{ matrix.packages }}
          pacman -Q ${{ matrix.version }}
      - name: The trial set, frame by frame
        uses: testsrc/run@v1
        with:
          token: ${{ secrets.TESTSRC_TOKEN }}
          player: ${{ matrix.player }}
          set: ${{ env.TESTSRC_TRIAL }}
          report-only: "true"
          out: testsrc-${{ matrix.player }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "testsrc-${{ matrix.player }}", path: "testsrc-${{ matrix.player }}/" }
